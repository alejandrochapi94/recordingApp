<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grabadora Auto</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Enlace al manifest (NUEVO) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ff3b30">
</head>
<body>
    <!-- (El resto del código de tus botones queda igual) -->
    <div class="app-container">
        <!-- Barra de estado con letra grande -->
        <div id="status-bar">LISTO</div>

        <!-- Botón Rojo -->
        <button id="btn-record" class="big-btn red-btn">
            <span class="icon">🔴</span>
            <span class="text" id="record-text">GRABAR</span>
        </button>

        <!-- Botón Verde -->
        <button id="btn-listen" class="big-btn green-btn" disabled>
            <span class="icon">🔊</span>
            <span class="text">ESCUCHAR</span>
        </button>

        <!-- Botón Amarillo -->
        <button id="btn-listen-again" class="big-btn yellow-btn" disabled>
            <span class="icon">🔄</span>
            <span class="text">REPETIR</span>
        </button>

        <!-- Reproductor oculto -->
        <audio id="audio-player" style="display:none;"></audio>
    </div>
    <script src="app.js"></script>
    
    <!-- Registro del Service Worker (NUEVO) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Service Worker registrado:', reg.scope))
            .catch(err => console.error('Error al registrar Service Worker:', err));
        });
      }
    </script>
</body>
</html>
